name: Test basic stale issue cleanup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          issue-types: 'issues,pull_requests'
          stale-issue-message: 'This issue is stale because it has been open for 60 days with no activity.'
          stale-pr-message: 'This PR is stale because it has been open for 60 days with no activity.'
          days-before-stale: 60
          days-before-close: 7
          stale-issue-label: 'Stale'
          stale-pr-label: 'Stale'
          loglevel: 'DEBUG'
          dry-run: 'true'
      - name: Assert action completed
        run: |
          echo "Action completed successfully in dry-run mode"
          echo "PASS"
